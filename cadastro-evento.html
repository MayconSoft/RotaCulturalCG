<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Evento - Agenda Cultural CG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="img/logo.svg" type="image/svg+xml">
</head>
<body>

    <header>
        <a href="index.html" class="marca">
            <img src="img/logo.svg" alt="" class="logo">
            <h1>Agenda Cultural <span>CG</span></h1>
        </a>
        <p>Cadastre seu evento cultural</p>

        <nav>
            <a href="index.html">Início</a>
            <a href="eventos.html">Eventos</a>
            <a href="login.html">Entrar</a>
            <a href="login-admin.html">Administrador</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Novo evento</h2>

            <p>
                Preencha os dados abaixo para enviar seu evento
                cultural para análise.
            </p>

            <form id="form-evento">

                <div>
                    <label for="nome">Nome do evento:</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Ex.: Festival Cultural"
                        required
                        maxlength="120"
                    >
                </div>

                <br>

                <div>
                    <label for="descricao">Descrição:</label>
                    <textarea
                        id="descricao"
                        name="descricao"
                        rows="4"
                        placeholder="Descreva o evento"
                        required
                        maxlength="2000"
                    ></textarea>
                </div>

                <br>

                <div>
                    <label for="categoria">Categoria:</label>
                    <select id="categoria" name="categoria" required>
                        <option value="">Selecione uma categoria</option>
                        <option value="Música">Música</option>
                        <option value="Gastronomia">Gastronomia</option>
                        <option value="Arte">Arte</option>
                        <option value="Teatro">Teatro</option>
                    </select>
                </div>

                <br>

                <div>
                    <label for="data">Data:</label>
                    <input
                        type="date"
                        id="data"
                        name="data"
                        required
                    >
                </div>

                <br>

                <div>
                    <label for="horario">Horário:</label>
                    <input
                        type="time"
                        id="horario"
                        name="horario"
                        required
                    >
                </div>

                <br>

                <div>
                    <label for="local">Local:</label>
                    <input
                        type="text"
                        id="local"
                        name="local"
                        placeholder="Endereço ou local do evento"
                        required
                        maxlength="200"
                    >
                </div>

                <br>

                <div>
                    <label for="imagem">Link da imagem do evento:</label>
                    <input
                        type="url"
                        id="imagem"
                        name="imagem"
                        placeholder="https://exemplo.com/imagem.jpg"
                    >
                </div>

                <br>

                <div>
                    <label for="ingresso">Informações sobre o ingresso:</label>
                    <input
                        type="text"
                        id="ingresso"
                        name="ingresso"
                        placeholder="Ex.: Entrada gratuita"
                        maxlength="200"
                    >
                </div>

                <br>

                <button type="submit">Enviar para aprovação</button>

            </form>

            <p id="mensagem" role="status" aria-live="polite"></p>

            <a href="eventos.html">Voltar para os eventos</a>
        </section>
    </main>

    <footer>
        <p>Agenda Cultural CG - Campo Grande, MS</p>
    </footer>

    <script>
        const formulario = document.getElementById("form-evento");
        const mensagem = document.getElementById("mensagem");

        // Impede o cadastro de uma data anterior à data atual.
        const campoData = document.getElementById("data");
        const hoje = new Date();
        const ano = hoje.getFullYear();
        const mes = String(hoje.getMonth() + 1).padStart(2, "0");
        const dia = String(hoje.getDate()).padStart(2, "0");

        campoData.min = ano + "-" + mes + "-" + dia;

        formulario.addEventListener("submit", function(event) {
            event.preventDefault();

            mensagem.textContent =
                "Evento enviado! Ele será publicado após a aprovação do curador.";
            formulario.reset();
        });
    </script>
    <script src="js/sessao.js"></script>

</body>
</html>
