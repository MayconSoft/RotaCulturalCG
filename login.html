<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Agenda Cultural CG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="img/logo.svg" type="image/svg+xml">
</head>
<body>

    <header>
        <a href="index.html" class="marca">
            <img src="img/logo.svg" alt="" class="logo">
            <h1>Agenda Cultural <span>CG</span></h1>
        </a>
        <p>Acesse sua conta</p>

        <nav>
            <a href="index.html">Início</a>
            <a href="eventos.html">Eventos</a>
            <a href="cadastro-evento.html">Cadastrar evento</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Entrar na plataforma</h2>

            <p>
                Entre para acessar as funcionalidades da Agenda Cultural CG.
            </p>

            <form id="form-login">
                <div>
                    <label for="email">E-mail:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        autocomplete="email"
                        required
                    >
                </div>

                <br>

                <div>
                    <label for="senha">Senha:</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <br>

                <button type="submit">Entrar</button>
            </form>

            <p>
                Ainda não tem uma conta?
                <a href="cadastro-usuario.html">Crie sua conta</a>
            </p>
        </section>
    </main>

    <footer>
        <p>Agenda Cultural CG - Campo Grande, MS</p>
    </footer>

    <script>
        document.getElementById("form-login").addEventListener("submit", function(event) {
            event.preventDefault();
            // Demonstração (só front-end): qualquer e-mail/senha é aceito.
            try { sessionStorage.setItem("usuarioLogado", "true"); } catch (e) {}
            window.location.href = "index.html";
        });
    </script>

</body>
</html>
